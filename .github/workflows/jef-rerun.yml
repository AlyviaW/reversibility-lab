name: JEF Rerun Reconstruction
on:
  push:
    branches: [jef-rerun-20261107]
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas pyarrow openpyxl statsmodels scipy matplotlib
      - name: Run reconstruction diagnostics
        run: python jef/reconstruct.py
      - uses: actions/upload-artifact@v4
        with:
          name: jef-reconstruction-stage1
          path: jef-run/output/
          retention-days: 90
