<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#444D36"/></marker></defs><rect x="0" y="0" width="1800" height="930" rx="0" fill="#F6F2E8" stroke="none" stroke-width="1"/><text x="65" y="80" font-family="Georgia, serif" font-size="51" font-weight="700" fill="#444D36" text-anchor="start">Decision rules, alternatives and feedback</text><text x="66" y="121" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#8A9673" text-anchor="start">A good tool changes the commitment structure when further evidence is too costly or slow.</text><rect x="80" y="203" width="460" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="103" y="247" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">A. DEFINE</text><text x="103" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">Commitment + claim + dated evidence</text><rect x="680" y="203" width="460" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="703" y="247" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">B. HARD CONSTRAINT</text><text x="703" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">Legal permission / rights / severe harm</text><rect x="1280" y="203" width="450" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="1303" y="247" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">C. EVIDENCE THRESHOLD</text><text x="1303" y="281" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">Does observed evidence justify exposure?</text><rect x="680" y="447" width="460" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="703" y="491" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">REDESIGN / REFER</text><text x="703" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">Gate failure: seek authority or redesign</text><rect x="1280" y="447" width="450" height="120" rx="8" fill="#444D36" stroke="#CCC8B8" stroke-width="1.5"/><text x="1303" y="491" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#FFFEFB" text-anchor="start">YES: PROCEED</text><text x="1303" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#FFFEFB" text-anchor="start">With owner, monitoring and exit plan</text><rect x="80" y="447" width="460" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="103" y="491" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">NO: REDUCE EXPOSURE?</text><text x="103" y="525" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">Can stage, pilot, cap losses or renegotiate?</text><rect x="80" y="700" width="460" height="120" rx="8" fill="#444D36" stroke="#CCC8B8" stroke-width="1.5"/><text x="103" y="744" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#FFFEFB" text-anchor="start">TEST SMALLER</text><text x="103" y="778" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#FFFEFB" text-anchor="start">Reassess the lower exposure against evidence</text><rect x="680" y="700" width="460" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="703" y="744" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">GATHER EVIDENCE</text><text x="703" y="778" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">When value of further information exceeds cost</text><rect x="1280" y="700" width="450" height="120" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1.5"/><text x="1303" y="744" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#444D36" text-anchor="start">DEFER OR STOP</text><text x="1303" y="778" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#242B20" text-anchor="start">If neither test nor safe action is feasible</text><path d="M540 264 H666" fill="none" stroke="#444D36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1140 264 H1266" fill="none" stroke="#444D36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M910 325 V432" fill="none" stroke="#444D36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="925" y="380" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A9673" text-anchor="start">Gate fails</text><path d="M1505 325 V432" fill="none" stroke="#444D36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1520" y="382" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A9673" text-anchor="start">Yes</text><path d="M1280 264 H1200 V388 H309 V433" fill="none" stroke="#444D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="635" y="373" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8A9673" text-anchor="start">No: examine commitment redesign</text><path d="M310 570 V685" fill="none" stroke="#444D36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="322" y="632" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A9673" text-anchor="start">Yes</text><path d="M540 509 H605 V755 H665" fill="none" stroke="#444D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="580" y="600" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8A9673" text-anchor="start">No; further evidence valuable</text><path d="M1140 761 H1265" fill="none" stroke="#444D36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1155" y="737" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#8A9673" text-anchor="start">Not viable</text><path d="M1500 828 V875 H300 V831" fill="none" stroke="#8A9673" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="720" y="893" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8A9673" text-anchor="start">Exit / revise → revisit action and claim</text></svg>