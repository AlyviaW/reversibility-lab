<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#444D36"/></marker></defs><rect x="0" y="0" width="1800" height="920" rx="0" fill="#F6F2E8" stroke="none" stroke-width="1"/><text x="65" y="83" font-family="Georgia, serif" font-size="55" font-weight="700" fill="#444D36" text-anchor="start">Decision-first system architecture</text><text x="67" y="123" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#8A9673" text-anchor="start">Company data is an evidence service, not the front door or the outcome variable.</text><rect x="62" y="201" width="320" height="239" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1"/><rect x="62" y="201" width="320" height="57" rx="8" fill="#444D36" stroke="none" stroke-width="1"/><text x="79" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFEFB" text-anchor="start">1 · DEFINE COMMITMENT</text><text x="80" y="304" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">Proposed action + critical</text><text x="80" y="331" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">claim</text><text x="80" y="379" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">Owner, date, £ amount, duration,</text><text x="80" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">alternatives</text><path d="M387 318 h13" fill="none" stroke="#444D36" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="409" y="201" width="320" height="239" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1"/><rect x="409" y="201" width="320" height="57" rx="8" fill="#CED4B7" stroke="none" stroke-width="1"/><text x="426" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#444D36" text-anchor="start">2 · REQUEST RELEVANT EVIDENCE</text><text x="427" y="304" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">Optional company ID /</text><text x="427" y="331" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">authorised docs</text><text x="427" y="379" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">Sources, availability dates,</text><text x="427" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">missing facts</text><path d="M734 318 h13" fill="none" stroke="#444D36" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="756" y="201" width="320" height="239" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1"/><rect x="756" y="201" width="320" height="57" rx="8" fill="#CED4B7" stroke="none" stroke-width="1"/><text x="773" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#444D36" text-anchor="start">3 · ASSESS EXPOSURE &amp; OPTIONS</text><text x="774" y="304" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">Financial, contractual,</text><text x="774" y="331" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">time, third-party</text><text x="774" y="379" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">Pilot, stage, renegotiate, defer</text><path d="M1081 318 h13" fill="none" stroke="#444D36" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1103" y="201" width="320" height="239" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1"/><rect x="1103" y="201" width="320" height="57" rx="8" fill="#CED4B7" stroke="none" stroke-width="1"/><text x="1120" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#444D36" text-anchor="start">4 · CHECK RULES &amp; COMPARE</text><text x="1121" y="304" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">Evidence threshold and</text><text x="1121" y="331" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">hard gates</text><text x="1121" y="379" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">Candidate weights only if</text><text x="1121" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">defensible</text><path d="M1428 318 h13" fill="none" stroke="#444D36" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1450" y="201" width="320" height="239" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1"/><rect x="1450" y="201" width="320" height="57" rx="8" fill="#CED4B7" stroke="none" stroke-width="1"/><text x="1467" y="238" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#444D36" text-anchor="start">5 · ACT &amp; MONITOR</text><text x="1468" y="304" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">Decision record + exit</text><text x="1468" y="331" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#444D36" text-anchor="start">trigger</text><text x="1468" y="379" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">Feedback to original claim and</text><text x="1468" y="401" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#242B20" text-anchor="start">action</text><rect x="62" y="492" width="1148" height="231" rx="8" fill="#FFFEFB" stroke="#CCC8B8" stroke-width="1"/><text x="86" y="532" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#444D36" text-anchor="start">UK DATA LIBRARY  •  SUPPORTS ONLY RELEVANT CLAIMS</text><text x="86" y="570" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#242B20" text-anchor="start">Company registry, accounts, procurement, grants, IP, regulatory and insolvency records</text><text x="86" y="606" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#242B20" text-anchor="start">Company number + source ID + disclosure date + permission + quality + reviewer</text><text x="86" y="643" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#242B20" text-anchor="start">No assumed access to private customers, stock, staff files or unseen contract clauses</text><text x="86" y="688" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#8A9673" text-anchor="start">Status: 5,851,547 IDs linked in local Stage 2; full episode-level model remains pending</text><rect x="1250" y="492" width="488" height="231" rx="8" fill="#EBDEBA" stroke="#CCC8B8" stroke-width="1"/><text x="1273" y="530" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#444D36" text-anchor="start">EVIDENCE ENGINES</text><text x="1273" y="568" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#242B20" text-anchor="start">Identity and dated source linkage</text><text x="1273" y="597" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#242B20" text-anchor="start">Claim-to-evidence mapping</text><text x="1273" y="626" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#242B20" text-anchor="start">Contract and exit-right extraction</text><text x="1273" y="655" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#242B20" text-anchor="start">Human confirmation of high-impact facts</text><text x="1273" y="684" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#242B20" text-anchor="start">Future LLM = extraction aid, not verifier</text><path d="M840 494 V449" fill="none" stroke="#444D36" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1480 490 V450" fill="none" stroke="#444D36" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1660 746 V811 H100 V451" fill="none" stroke="#8A9673" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="800" y="810" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#444D36" text-anchor="start">Monitoring loop: contradictory evidence activates review and re-scoping</text></svg>